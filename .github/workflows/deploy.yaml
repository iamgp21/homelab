name: ArgoCD Deploy

on:
  push:
    branches:
      - dev
    paths:
      - helm-values/**
  
  workflow_dispatch:

jobs:
  infra_scan:
    name: 'IaC Static Scan'
    runs-on: homelab
    # defaults:
    #   run:
    #     working-directory: ./infra

    permissions:
      # required for all workflows
      security-events: write
      contents: 'read'
      id-token: 'write'

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: 'actions/checkout@v4' 

    - name: Make Infra Scan Directory
      run: mkdir -p infra_scan_results
    
    - name: run kics Scan
      uses: Checkmarx/kics-github-action@latest
      with:
        path: 'homelab' # path to the directory containing the terraform files
        ignore_on_exit: results #dont fail on results (overwrite default behaviour fails)
        output_path: 'infra_scan_results' # when provided with a directory on output_path it will generate the specified reports file named 'results.{extension}'
        platform_type: terraform
        output_formats: 'sarif'
    
    # - name: Display Results
    #   run: |
    #     cat infra_scan_results/results.sarif

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: infra_scan_results/results.sarif
    
  argocd_deploy:
    name: 'argocd deploy'
    runs-on: homelab
    needs: infra_scan # Needs infra_scan job to be completed succussfully
    # defaults:
    #   run:
    #     working-directory: ./infra

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: 'actions/checkout@v4'
          
    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: "Setup Terraform"
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.9.0"
    
    # Checks that all Terraform configuration files adhere to a canonical format
    - name: "Terraform Format"
      id: fmt
      run: terraform fmt
      continue-on-error: false
    
    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: "Terraform Init"
      id: init
      run: |
        terraform init -input=false

    # Generates an execution plan for Terraform
    - name: "Terraform Plan"
      id: plan
      run: terraform plan -input=false -lock=false -refresh=true -no-color

    # Exit when plan failes
    - name: "Terraform Plan Status"
      if: steps.plan.outcome == 'failure'
      run: exit 1
  
    - name: "Terraform Apply"
      id: apply
      if: github.event_name == 'push'
      run: terraform apply -input=false -lock=false -refresh=true -auto-approve -no-color